<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Alumni Connect prototype: students book calls with verified alumni of online degree programmes. First connect is free.">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Alumni Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap">
<style>
/* Layout: Airbnb-style marketplace. Student side = pill search + category strip + photo grid + listing page with sticky booking card. Alumni side = hosting-style top tabs. */
:root{
  --bg:#FFFFFF; --soft:#F7F7F7; --ink:#222222; --muted:#6A6A6A; --line:#DDDDDD; --line-soft:#EBEBEB;
  --brand:#FF385C; --brand-deep:#D70466; --brand-ink:#D70466; --brand-soft:#FFF0F3; --on-brand:#FFFFFF; --star:#222222;
  --good:#008A05; --good-soft:#E8F5E9; --warn:#B25E00; --warn-soft:#FFF4E5; --bad:#C13515; --bad-soft:#FDECEA;
  --h1:#EDE3F7; --h2:#DCEBF7; --h3:#E0F2E3; --h4:#FBE6D6; --h5:#F8E0EA; --h6:#E4E7FA;
  --grad:linear-gradient(to right,#E61E4D 0%,#E31C5F 50%,#D70466 100%);
  --font:"DM Sans", "Helvetica Neue", system-ui, -apple-system, sans-serif;
  --pop:0 6px 20px rgba(0,0,0,.2); --surface:#FFFFFF; color-scheme:light;
  --shadow:0 6px 16px rgba(0,0,0,.12); --shadow-sm:0 1px 2px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.05);
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1760px;margin:0 auto;padding-inline:clamp(16px,4vw,80px)}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line-soft)}
.top-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding-block:14px}
.logo{display:flex;align-items:center;gap:8px;color:var(--brand);font-weight:800;font-size:21px;letter-spacing:-.03em;border:0;background:none;padding:0;justify-self:start}
.logo svg{width:32px;height:32px}
.right{display:flex;align-items:center;gap:8px;justify-self:end}
.switch-link{border:0;background:none;font-weight:600;font-size:14px;padding:10px 14px;border-radius:99px;white-space:nowrap}
.switch-link:hover{background:var(--soft)}
.menu{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:99px;padding:5px 5px 5px 12px;background:var(--bg)}
.menu:hover{box-shadow:var(--shadow-sm)}
.menu img,.menu .av{width:30px;height:30px;border-radius:50%;object-fit:cover}
.freechip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:8px 12px;border-radius:99px;background:var(--brand-soft);color:var(--brand-ink);white-space:nowrap}
.freechip.used{background:var(--soft);color:var(--muted)}

/* pill search */
.center{position:relative}
.search{display:flex;align-items:center;border:1px solid var(--line);border-radius:99px;box-shadow:var(--shadow-sm);background:var(--bg);padding:6px 6px 6px 0;min-width:0;transition:background .15s}
.search.open{background:var(--soft);box-shadow:none}
.search .seg{display:grid;gap:1px;padding:8px 22px;border:0;border-right:1px solid var(--line-soft);background:transparent;text-align:left;min-width:0;border-radius:99px;font:inherit;color:inherit;cursor:pointer}
.search .seg:last-of-type{border-right:0}
.search .seg:hover{background:var(--soft)}
.search.open .seg:hover{background:var(--line-soft)}
.search .seg[aria-expanded="true"]{background:var(--bg);box-shadow:var(--pop);border-right-color:transparent}
.search .seg .k{font-size:12px;font-weight:700}
.search .seg .v{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.search .seg .v.set{color:var(--ink);font-weight:600}
.search .seg.txt{cursor:text}
.search input{border:0;background:transparent;font-size:14px;color:var(--ink);padding:0;outline:none;min-width:0;width:100%}
.search input::placeholder{color:var(--muted)}
.dd{position:absolute;top:calc(100% + 12px);left:0;z-index:40;width:min(440px,100%);background:var(--surface);border:1px solid var(--line-soft);border-radius:32px;box-shadow:var(--pop);padding:16px;display:grid;gap:2px;max-height:min(70vh,520px);overflow:auto;animation:ddin .16s ease-out}
.dd.right{left:auto;right:0}
@keyframes ddin{from{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.dd{animation:none}}
.dd h4{margin:4px 12px 8px;font-size:12px;font-weight:700;color:var(--muted)}
.ddo{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:14px;font:inherit;color:var(--ink);cursor:pointer}
.ddo:hover,.ddo:focus-visible{background:var(--soft);outline:none}
.ddo .tile{width:48px;height:48px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none;border:1px solid var(--line-soft)}
.ddo:hover .tile,.ddo:focus-visible .tile{background:var(--surface)}
.ddo .tile svg.i{width:22px;height:22px;stroke-width:1.6}
.ddo .txt{display:grid;min-width:0;flex:1}
.ddo .txt b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddo .txt small{font-size:13px;color:var(--muted)}
.ddo .ok{display:grid;color:var(--ink);visibility:hidden}
.ddo .ok svg.i{width:18px;height:18px;stroke-width:2.5}
.ddo[aria-selected="true"] .ok{visibility:visible}
.ddo[aria-selected="true"] .txt b{font-weight:700}
.search .go{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:grid;place-items:center}
.search .go svg.i{stroke-width:3;width:16px;height:16px}

/* categories */
.cats-row{display:flex;align-items:center;gap:20px;padding-block:14px 0}
.cats{display:flex;gap:32px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{border:0;background:none;display:grid;justify-items:center;gap:8px;padding:4px 0 12px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.cat svg.i{width:24px;height:24px;stroke-width:1.6}
.cat:hover{color:var(--ink);border-color:var(--line)}
.cat[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.pillbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 16px;font-weight:600;font-size:13px;white-space:nowrap}
.pillbtn:hover{border-color:var(--ink)}
.pillbtn .count{background:var(--ink);color:var(--bg);border-radius:99px;font-size:11px;padding:0 6px}

/* free banner */
.banner{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-block:20px 8px;flex-wrap:wrap}
.banner .gift{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.banner .gift svg.i{width:20px;height:20px}
.banner .txt{flex:1;min-width:220px;display:grid;gap:2px}
.banner .txt b{font-size:15px}
.banner .txt span{font-size:14px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;font-weight:600;text-decoration:underline;font-size:14px}

/* grid */
.results-meta{font-size:14px;color:var(--muted);padding-block:16px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:24px;padding-block:12px 64px}
.card{display:flex;flex-direction:column;cursor:pointer;min-width:0;background:var(--surface);border:1px solid var(--line-soft);border-radius:20px;padding:8px;transition:box-shadow .2s,transform .2s,border-color .2s}
.card:hover{box-shadow:0 12px 32px rgba(0,0,0,.10);border-color:transparent;transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.card,.card:hover{transition:none;transform:none}}
.ph{position:relative;aspect-ratio:5/4;border-radius:14px;overflow:hidden;background:var(--soft);max-width:100%}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:start;position:relative;overflow:hidden}
.slide img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block;transition:transform .35s}
.card:hover .slide img{transform:scale(1.03)}
.fav{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.95);color:#222;font-size:13px;font-weight:600;padding:5px 10px;border-radius:99px;box-shadow:0 1px 2px rgba(0,0,0,.18);z-index:2}
.onphoto{position:absolute;left:12px;bottom:26px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.95);color:#222;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.onphoto svg.i{width:13px;height:13px;stroke-width:3;color:#E31C5F}
.sl-pane{padding:20px 20px 30px;display:flex;flex-direction:column;gap:10px;justify-content:space-between;color:var(--ink)}
.sl-k{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.75}
.sl-big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.sl-big small{font-size:16px;font-weight:600;opacity:.6;margin-left:2px}
.sl-bars{display:grid;gap:7px}
.sl-bar{display:grid;grid-template-columns:84px minmax(0,1fr) 26px;gap:8px;align-items:center;font-size:12px;font-weight:600}
.sl-bar .t{height:6px;border-radius:99px;background:color-mix(in srgb,var(--ink) 14%,transparent);overflow:hidden}
.sl-bar .t b{display:block;height:100%;background:var(--ink);border-radius:99px}
.sl-facts{display:flex;gap:16px;font-size:12px;font-weight:600;flex-wrap:wrap}
.sl-facts span{opacity:.7;font-weight:500}
.sl-q{font-size:19px;line-height:1.35;font-weight:600;letter-spacing:-.01em}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#222;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.2);opacity:0;transition:opacity .15s,transform .15s;z-index:2}
.arrow svg.i{width:14px;height:14px;stroke-width:3}
.arrow.prev{left:10px}.arrow.next{right:10px}
.arrow:hover{transform:translateY(-50%) scale(1.06)}
.card:hover .arrow,.arrow:focus-visible{opacity:1}
@media (hover:none){.arrow{display:none}}
.dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:2;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:0 0 0 1px rgba(0,0,0,.12);transition:transform .15s}
.dots i.on{background:#fff;transform:scale(1.15)}
.heart{position:absolute;top:10px;right:10px;border:0;background:none;padding:4px;z-index:2}
.heart svg{width:26px;height:26px;fill:rgba(0,0,0,.5);stroke:#fff;stroke-width:2}
.heart[aria-pressed="true"] svg{fill:#FF385C}
.ct{display:grid;gap:2px;font-size:15px;min-width:0}
.l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.l1 b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rate{display:inline-flex;align-items:center;gap:4px;font-size:14px;white-space:nowrap}
.rate svg{width:13px;height:13px;fill:var(--star);stroke:none}
.ct .m{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rate .cnt{color:var(--muted)}
.avail{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.avail.soon{color:var(--good);font-weight:600}
.avail svg.i{width:14px;height:14px}
.price-line .u{text-decoration:underline;color:var(--muted)}
.price-line{font-size:15px;margin-top:4px}
.price-line s{color:var(--muted);font-weight:400}
.price-line b{font-weight:700}
.price-line .free{color:var(--brand-ink)}

/* card body */
.co{position:absolute;left:10px;bottom:24px;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.96);color:#222;font-size:12.5px;font-weight:600;padding:4px 10px 4px 4px;border-radius:99px;box-shadow:0 1px 3px rgba(0,0,0,.18);max-width:calc(100% - 20px)}
.co i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#222;flex:none}
.co span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb{padding:14px 8px 12px;display:grid;gap:6px;min-width:0}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.who h3{font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px;min-width:0;letter-spacing:-.01em}
.who h3 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vt{width:17px;height:17px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.vt svg.i{width:10px;height:10px;stroke-width:4}
.role{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deg{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;color:var(--muted);margin-top:2px}
.deg b{flex:none;font-size:12px;font-weight:700;color:var(--ink);padding:3px 8px;border-radius:6px}
.deg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:6px;overflow:hidden;margin-top:4px;-webkit-mask-image:linear-gradient(to right,#000 85%,transparent);mask-image:linear-gradient(to right,#000 85%,transparent)}
.tags span{flex:none;font-size:12px;font-weight:500;border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap;color:var(--ink)}
.tags span.more{color:var(--muted)}
.cf{margin-top:auto;border-top:1px solid var(--line-soft);padding:12px 8px 4px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.pr{display:grid;gap:3px;min-width:0}
.pr .top{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.pr .top b{font-size:18px;font-weight:800;letter-spacing:-.01em}
.pr .top b.free{color:var(--brand-ink)}
.pr .top span{font-size:13px;color:var(--muted)}
.pr .nx{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.pr .nx svg.i{width:13px;height:13px}
.pr .nx.soon{color:var(--good);font-weight:600}
.btn.cta{padding:9px 14px;font-size:14px;border-radius:8px;flex:none}
.sl-pane{padding:16px 16px 26px;overflow:hidden}
.sl-big{font-size:32px}
.sl-bars{gap:5px}
.sl-q{font-size:16px;line-height:1.4}
.empty{padding:64px 16px;text-align:center;color:var(--muted)}

/* buttons */
.btn{border:1px solid var(--ink);background:var(--bg);padding:12px 20px;border-radius:8px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.dark:hover{opacity:.88}
.btn.brand{background:var(--grad);border:0;color:#fff;font-weight:700;padding:14px 20px;font-size:16px}
.btn.brand:hover{opacity:.95}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* modal (filters) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--bg);border-radius:16px;width:min(640px,100%);max-height:90vh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;box-shadow:var(--shadow)}
.modal-h{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line-soft);text-align:center;font-weight:700}
.x{width:32px;height:32px;border-radius:50%;border:0;background:none;display:grid;place-items:center}
.x:hover{background:var(--soft)}
.modal-b{overflow:auto;padding:8px 24px}
.modal-b section{padding-block:24px;border-bottom:1px solid var(--line-soft);display:grid;gap:14px}
.modal-b section:last-child{border-bottom:0}
.modal-b h3{font-size:20px}
.modal-f{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-top:1px solid var(--line-soft)}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:10px 18px;font-size:14px;font-weight:500}
.opt:hover{border-color:var(--ink)}
.opt svg.i{width:16px;height:16px;vertical-align:-3px;margin-right:6px}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:grid;gap:6px;font-size:14px;font-weight:600}
.field select,.input,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px;font-size:15px;width:100%}
textarea{resize:vertical}

/* ---------- listing page ---------- */
.page{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(16px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.page{animation:none}.ph img{transition:none}}
.page-bar{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line-soft)}
.page-bar .in{max-width:1120px;margin:0 auto;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ghost{border:0;background:none;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:8px 10px;border-radius:8px;text-decoration:underline}
.ghost:hover{background:var(--soft)}
.listing{max-width:1120px;margin:0 auto;padding:24px 24px 120px}
.listing h1{font-size:clamp(22px,3vw,28px);font-weight:600}
.subline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:15px;margin-top:6px}
.subline b{font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:80px;margin-top:28px;align-items:start}
.hostcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;border-radius:24px;box-shadow:0 6px 20px rgba(0,0,0,.14);padding:28px 32px;background:var(--bg)}
.hostcard .face{display:grid;justify-items:center;gap:6px;text-align:center}
.hostcard .face .pic{position:relative}
.hostcard .face img{width:112px;height:112px;border-radius:50%;object-fit:cover;display:block}
.hostcard .face .badge{position:absolute;right:-2px;bottom:4px;width:32px;height:32px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center}
.hostcard .face .badge svg.i{width:16px;height:16px;stroke-width:3}
.hostcard .face h2{font-size:26px;font-weight:700}
.hostcard .face span{font-size:13px;font-weight:600}
.hstats{display:grid;gap:0}
.hstats div{padding-block:10px;border-bottom:1px solid var(--line)}
.hstats div:last-child{border-bottom:0}
.hstats b{display:block;font-size:22px;font-weight:700;line-height:1.1}
.hstats span{font-size:12px;font-weight:600}
.sec{padding-block:32px;border-bottom:1px solid var(--line)}
.sec h2{font-size:22px;font-weight:600;margin-bottom:20px}
.hl{display:grid;gap:22px}
.hl div{display:grid;grid-template-columns:28px minmax(0,1fr);gap:20px}
.hl svg.i{width:26px;height:26px;stroke-width:1.6}
.hl b{display:block;font-weight:600}
.hl span{color:var(--muted);font-size:14px}
.bigquote{font-size:18px;line-height:1.5;max-width:60ch}
.ask{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.ask div{display:flex;gap:14px;align-items:center}
.ask svg.i{width:24px;height:24px;stroke-width:1.6}
.overall{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.overall b{font-size:44px;font-weight:700;letter-spacing:-.03em}

.dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}

.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}

function filtered(){
  const q=S.q.trim().toLowerCase();
  let list=ALUMNI.filter(a=>{
    if(q&&![a.name,a.college,a.company,a.course,a.role,a.city].join(' ').toLowerCase().includes(q))return false;
    if(S.college!=='all'&&a.college!==S.college)return false;
    if(S.course!=='all'&&!a.course.startsWith(S.course))return false;
    if(S.cat!=='all'&&a.stream!==S.cat)return false;
    if(S.topic&&!a.topics.includes(S.topic))return false;
    if(S.price!=='any'&&a.services[0].price>+S.price)return false;
    return true});
  if(S.sort==='rating')list.sort((a,b)=>b.rating-a.rating);
  if(S.sort==='price')list.sort((a,b)=>a.services[0].price-b.services[0].price);
  if(S.sort==='recent')list.sort((a,b)=>b.batch-a.batch);
  return list}

function syncSlide(track){
  const ph=track.parentElement,i=Math.round(track.scrollLeft/track.clientWidth),n=track.children.length;
  ph.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k===i));
  ph.querySelector('.arrow.prev').hidden=i===0;ph.querySelector('.arrow.next').hidden=i>=n-1}
document.addEventListener('scroll',e=>{const t=e.target;if(t.classList&&t.classList.contains('track'))syncSlide(t)},true);

function nextDays(){const out=[],b=new Date();for(let i=0;i<7;i++){const d=new Date(b);d.setDate(b.getDate()+i);
  out.push({dow:i===0?'Today':i===1?'Tmrw':d.toLocaleDateString('en-IN',{weekday:'short'}),dd:d.getDate(),long:d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})})}return out}
const SLOTS=['10:00 AM','12:30 PM','5:00 PM','6:30 PM','8:00 PM','9:30 PM'];

function listing(a){
  const avg=(Object.values(a.scores).reduce((x,y)=>x+y,0)/4);
  const yrs=new Date().getFullYear()-a.batch;
  const s=a.services[S.svc];
  return `<div class="page" role="dialog" aria-modal="true" aria-label="${esc(a.name)}">
    <div class="page-bar"><div class="in"><button class="ghost" data-closepage>${ic('back')}All alumni</button>
      <div style="display:flex;gap:4px"><button class="ghost" data-sharebtn>${ic('share')}Share</button><button class="ghost" data-heart="${a.id}" aria-pressed="${S.saved.has(a.id)}">${S.saved.has(a.id)?'Saved':'Save'}</button></div></div></div>
    <div class="listing">
      <h1>Ask ${esc(a.first)} what ${esc(a.college)} is really like</h1>
      <div class="subline"><span class="rate num">${STAR}<b>${a.rating.toFixed(2)}</b></span>·<b class="num" style="text-decoration:underline">${a.reviews} reviews</b>·<span>${esc(a.course)}, ${a.batch}</span>·<span>${esc(a.city)}</span></div>
      <div class="cols">
        <div>
          <div class="hostcard">
            <div class="face"><div class="pic"><img src="${a.img}" alt="${esc(a.name)}"><span class="badge" title="Verified alumni">${ic('check')}</span></div>
              <h2>${esc(a.first)}</h2><span>${esc(a.role)} at ${esc(a.company)}</span></div>
            <div class="hstats"><div><b class="num">${a.reviews}</b><span>Reviews</span></div><div><b class="num">${a.rating.toFixed(2)}★</b><span>Rating</span></div><div><b class="num">${yrs}</b><span>Years since graduating</span></div></div>
          </div>
          <div class="sec"><div class="hl">
            ${a.fav?`<div>${ic('medal')}<p><b>Student favourite</b><span>One of the most-loved alumni on Alumni Connect, based on ratings and reviews.</span></p></div>`:''}
            <div>${ic('shield')}<p><b>Verified alumni</b><span>${esc(a.course)}, batch of ${a.batch}. Verified with a university email and degree certificate.</span></p></div>
            <div>${ic('clock')}<p><b>Replies ${a.respond}</b><span>${a.calls} calls completed with students and parents.</span></p></div>
          </div></div>
          <div class="sec"><h2>In ${esc(a.first)}'s words</h2><p class="bigquote">“${esc(a.quote)}”</p></div>
          <div class="sec"><h2>What you can ask about</h2><div class="ask">
            ${a.topics.map(t=>`<div>${ic(TOPIC_ICON[t]||'chat')}<span>${esc(t)}</span></div>`).join('')}
            <div>${ic('users')}<span>Peers and networking</span></div><div>${ic('cap')}<span>Admission and eligibility</span></div></div></div>
          <div class="sec"><div class="overall">${STAR.replace('<svg','<svg style="width:28px;height:28px;fill:currentColor"')}<b class="num">${avg.toFixed(1)}</b><span class="muted">${esc(a.first)}'s university scorecard, out of 5</span></div>
            <div class="scores">${Object.entries(a.scores).map(([k,v])=>`<div class="score"><span>${k}</span><b class="num">${v.toFixed(1)}</b>${ic(SCORE_ICON[k])}</div>`).join('')}</div>
            <div class="facts"><div class="fact"><b class="num">${a.median}</b><span>${esc(a.first)}'s salary change after the degree</span></div><div class="fact"><b class="num">${a.fees}</b><span>Total fees paid over the course</span></div></div></div>
          <div class="sec" style="border-bottom:0"><h2><span class="num">${STAR.replace('<svg','<svg style="width:18px;height:18px;fill:currentColor;vertical-align:-2px"')} ${a.rating.toFixed(2)} · ${a.reviews} reviews</span></h2>
            <div class="reviews">${REVIEWS.map(([n,c,t,h])=>`<div class="rv"><div class="who">${avI(n,h,44)}<div><b>${n}</b><span>${c}</span></div></div><div class="stars">${STAR.repeat(5)}</div><p>${esc(t)}</p></div>`).join('')}</div></div>
        </div>
        <aside class="book" id="bookcard">${bookCard(a)}</aside>
      </div>
    </div>
    <div class="mbar"><div><div class="num" style="font-weight:600">${S.freeLeft?`<span style="color:var(--brand-ink)">Free</span> <s class="muted" style="font-weight:400">${rupee(s.price)}</s>`:rupee(s.price)}</div><div class="muted" style="font-size:13px">${S.freeLeft?'Your first connect':s.t==='call'?`${s.dur} min call`:'Priority DM'}</div></div>
      <button class="btn brand" data-scrollbook>${S.freeLeft?'Book free':'Book'}</button></div>
  </div>`}

function bookCard(a){
  const s=a.services[S.svc];
  const free=S.freeLeft>0;
  const days=nextDays();
  if(S.done){
    const d=S.done;
    return `<div class="done"><span class="ok">${ic('check')}</span><h2 style="font-size:22px">${d.t==='call'?'Your call is booked':'Your question is sent'}</h2>
      <p class="muted">${d.t==='call'?`${esc(a.first)} will meet you on ${d.when} at ${d.slot}. The video link is in your email and WhatsApp.`:`${esc(a.first)} usually replies ${a.respond}. We'll notify you when the answer is ready.`}</p>
      ${d.free?`<div class="freenote" style="text-align:left">${ic('gift')}<span>You used your <b>free first connect</b>. Your next connect with any alumni is paid.</span></div>`:`<p class="num" style="font-weight:600">Paid ${rupee(d.paid)}</p>`}
      <button class="btn block" data-again>Book another session</button></div>`}
  const can=s.t==='dm'||S.slot;
  return `<div class="p num">${free?`<span class="free">Free</span><s>${rupee(s.price)}</s>`:rupee(s.price)}<small>${s.t==='call'?`/ ${s.dur} min call`:'/ question'}</small></div>
    ${free?`<div class="freenote">${ic('gift')}<span><b>Your first connect is free.</b> After this, ${esc(a.first)} charges ${rupee(s.price)} per ${s.t==='call'?'call':'question'}.</span></div>`:''}
    <div class="picker"><div class="row2">${a.services.map((x,i)=>`<button class="svcopt" data-svc="${i}" aria-pressed="${S.svc===i}"><span>${x.t==='call'?'Video call':'Priority DM'}</span><b>${x.t==='call'?`${x.dur} min`:`Reply in ${x.eta}`}</b></button>`).join('')}</div></div>
    ${s.t==='call'?`
      <div style="display:grid;gap:8px"><span class="lbl">Date</span><div class="dates">${days.map((d,i)=>`<button class="date" data-date="${i}" aria-pressed="${S.date===i}"><small>${d.dow}</small><b class="num">${d.dd}</b></button>`).join('')}</div></div>
      <div style="display:grid;gap:8px"><span class="lbl">Time (IST)</span><div class="slots">${SLOTS.filter((x,i)=>(S.date+i)%4!==1).map(x=>`<button class="slot num" data-slot="${x}" aria-pressed="${S.slot===x}">${x}</button>`).join('')}</div></div>`
    :`<label style="display:grid;gap:8px"><span class="lbl">Your question</span><textarea id="dm" rows="4" placeholder="e.g. Are live classes recorded? I work night shifts."></textarea></label>`}
    <button class="btn brand block" id="confirm" ${can?'':'disabled'}>${can?(free?(s.t==='call'?'Book free call':'Send free question'):(s.t==='call'?'Book call':'Send question')):'Choose a time'}</button>
    <p class="charge">${free?'You won\'t be charged for this one':'You\'ll pay after confirming'}</p>
    <div class="lines num">
      <div><span class="u">${s.t==='call'?`${s.dur} min video call`:'Priority DM'}</span><span>${rupee(s.price)}</span></div>
      ${free?`<div class="disc"><span>First connect free</span><span>−${rupee(s.price)}</span></div>`:''}
      <div class="total"><span>Total</span><span>${free?'₹0':rupee(s.price)}</span></div>
    </div>`}

/* ---------- render ---------- */
function render(){
  $('#top').innerHTML=header();
  $('#app').innerHTML=S.view==='student'?browse():dash();
  renderOverlay()}
function renderResults(){const r=$('#results');if(r)r.innerHTML=results();const fb=$('#open-filters');if(fb)fb.innerHTML=`${ic('sliders')}Filters${filterCount()?`<span class="count num">${filterCount()}</span>`:''}`}
function renderOverlay(){
  const a=S.profile&&ALUMNI.find(x=>x.id===S.profile);
  let h='';
  if(S.view==='student'&&a)h=listing(a);
  if(S.view==='student'&&S.filtersOpen)h+=filtersModal();
  $('#overlay').innerHTML=h;
  document.body.style.overflow=h?'hidden':''}
function renderBook(){const a=ALUMNI.find(x=>x.id===S.profile);const p=$('.page');const st=p?p.scrollTop:0;renderOverlay();const p2=$('.page');if(p2)p2.scrollTop=st}
function open(id){Object.assign(S,{profile:id,svc:0,date:0,slot:null,done:null});renderOverlay()}

document.addEventListener('submit',e=>{if(e.target.id==='searchform'){e.preventDefault();renderResults()}});
document.addEventListener('click',e=>{
  if(S.dd&&!e.target.closest('.dd,[data-dd]')){setDD(null)}
  const pk=e.target.closest('[data-pick]');
  if(pk){S[S.dd]=pk.dataset.pick;const k=S.dd;setDD(null);renderResults();$('#dd-'+k)?.focus();return}
  const dd=e.target.closest('[data-dd]');
  if(dd){setDD(S.dd===dd.dataset.dd?null:dd.dataset.dd);return}
  const t=e.target.closest('button,[data-open],[data-scrim]');if(!t)return;
  const d=t.dataset;
  if(d.view){S.view=d.view;S.profile=null;S.filtersOpen=false;try{localStorage.setItem('ac2-view',S.view)}catch(_){};render();scrollTo(0,0);return}
  if(d.heart){const id=+d.heart;S.saved.has(id)?S.saved.delete(id):S.saved.add(id);t.setAttribute('aria-pressed',S.saved.has(id));if(!t.classList.contains('heart'))t.textContent=S.saved.has(id)?'Saved':'Save';
    document.querySelectorAll(`.heart[data-heart="${id}"]`).forEach(h=>h.setAttribute('aria-pressed',S.saved.has(id)));toast(S.saved.has(id)?'Saved to your shortlist':'Removed from shortlist');return}
  if(d.slide){const tr=t.parentElement.querySelector('.track');tr.scrollBy({left:+d.slide*tr.clientWidth,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});return}
  if(d.open){open(+d.open);return}
  if(d.home!==undefined){Object.assign(S,{cat:'all',q:'',college:'all',course:'all',dd:null});render();return}
  if(d.cat){S.cat=d.cat;document.querySelectorAll('.cat').forEach(c=>c.setAttribute('aria-pressed',c.dataset.cat===S.cat));renderResults();return}
  if(t.id==='open-filters'){S.filtersOpen=true;renderOverlay();return}
  if(d.closefilters!==undefined||(d.scrim==='filters'&&e.target===t)){S.filtersOpen=false;renderOverlay();renderResults();return}
  if(d.topic){S.topic=S.topic===d.topic?null:d.topic;renderOverlay();return}
  if(d.price){S.price=d.price;renderOverlay();return}
  if(d.sort){S.sort=d.sort;renderOverlay();return}
  if(d.clearfilters!==undefined){Object.assign(S,{price:'any',topic:null,sort:'rec'});renderOverlay();return}
  if(d.clear!==undefined){Object.assign(S,{q:'',college:'all',course:'all',cat:'all',price:'any',topic:null,sort:'rec'});render();return}
  if(d.resetfree!==undefined){S.freeLeft=1;render();toast('Demo reset: free connect restored');return}
  if(d.closepage!==undefined){S.profile=null;renderOverlay();return}
  if(d.sharebtn!==undefined){toast('Profile link copied');return}
  if(d.scrollbook!==undefined){$('#bookcard')?.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(d.svc){S.svc=+d.svc;S.slot=null;renderBook();return}
  if(d.date){S.date=+d.date;S.slot=null;renderBook();return}
  if(d.slot){S.slot=d.slot;renderBook();return}
  if(d.again!==undefined){S.done=null;S.slot=null;renderBook();return}
  if(t.id==='confirm'){
    const a=ALUMNI.find(x=>x.id===S.profile),s=a.services[S.svc];
    if(s.t==='dm'&&($('#dm')?.value||'').trim().length<10){toast('Write a question of at least 10 characters');return}
    if(s.t==='call'&&!S.slot)return;
    const free=S.freeLeft>0;
    S.done={t:s.t,free,paid:s.price,when:nextDays()[S.date].long,slot:S.slot};
    if(free)S.freeLeft=0;S.connects++;
    $('#top').innerHTML=header();renderResults();const b=$('.banner');if(b)b.outerHTML=banner();
    renderBook();return}
  /* dashboard */
  if(d.tab){S.tab=d.tab;render();scrollTo(0,0);return}
  if(d.rtab){S.rTab=d.rtab;render();return}
  if(d.answer){const v=($('#ans-'+d.answer)?.value||'').trim();if(!v){toast('Write an answer before sending');return}
    const q=QUESTIONS.find(x=>x.id===d.answer);S.answered.add(d.answer);render();toast(q.free?'Answer sent. This was their free first connect':`Answer sent. ${rupee(q.amt)} added to earnings`);return}
  if(t.id==='copy-link'){const txt='alumniconnect.in/ananya-iyer';(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Profile link copied'),()=>toast('Your link: '+txt));return}
  if(d.join!==undefined){toast('In the live product this opens the video call');return}
  if(d.msg!==undefined){toast('In the live product this opens a chat with the student');return}
  if(t.id==='add-svc'){SERVICES.push({id:'s'+(SERVICES.length+1),title:'New service',kind:'Video call',dur:15,price:99,on:false,booked:0,icon:'video'});render();toast('Draft added. Set a price, then switch it on');return}
  if(d.addslot){const sl=WEEK[+d.addslot][1];const n=['7:00 PM','8:00 PM','9:00 PM','10:00 AM','6:00 PM'].find(o=>!sl.includes(o));if(n){sl.push(n);render()}return}
  if(t.id==='save-av'){toast('Calendar saved');return}
  if(t.id==='save-review'){const q=$('#my-quote').value.trim();if(q)ME.quote=q;ME.median=$('#my-ctc').value;ME.fees=$('#my-fees').value;Object.assign(ME.scores,MY_SCORES);toast('Review saved. Students see it on your profile');return}
  if(t.id==='withdraw'){toast('Withdrawal of ₹4,980 requested');return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.dd){const k=S.dd;setDD(null);$('#dd-'+k)?.focus();return}
  if((e.key==='ArrowDown'||e.key==='ArrowUp')&&e.target.closest('.dd')){e.preventDefault();const o=[...document.querySelectorAll('.ddo')],i=o.indexOf(e.target);o[(i+(e.key==='ArrowDown'?1:-1)+o.length)%o.length].focus();return}
  if(e.key==='Escape'){if(S.filtersOpen){S.filtersOpen=false;renderOverlay()}else if(S.profile){S.profile=null;renderOverlay()}}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open]')){e.preventDefault();open(+e.target.dataset.open)}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.q=t.value;renderResults()}
  if(t.dataset.score){MY_SCORES[t.dataset.score]=+t.value;$('#scv-'+t.id.split('-')[1]).textContent=(+t.value).toFixed(1)}
  if(t.dataset.setprice){const s=SERVICES.find(x=>x.id===t.dataset.setprice);s.price=Math.max(0,+t.value||0);if(s.id==='s1')ME.services[0].price=s.price;if(s.id==='s2')ME.services[1].price=s.price}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.toggle){const s=SERVICES.find(x=>x.id===t.dataset.toggle);s.on=t.checked;render();toast(s.on?'Service is live on your profile':'Service hidden from students')}});
render();
</script>

</body>
