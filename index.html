<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Alumni Connect prototype: students book calls with verified alumni of online and on-campus degree programmes. First connect is 25% off.">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Alumni Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap">
<style>
/* Layout: Airbnb-style marketplace. Student side = pill search + category strip + photo grid + listing page with sticky booking card. Alumni side = hosting-style top tabs. */
:root{
  --bg:#FFFFFF; --soft:#F7F7F7; --ink:#222222; --muted:#6A6A6A; --line:#DDDDDD; --line-soft:#EBEBEB;
  --brand:#FF385C; --brand-deep:#D70466; --brand-ink:#D70466; --brand-soft:#FFF0F3; --on-brand:#FFFFFF; --star:#222222;
  --good:#008A05; --good-soft:#E8F5E9; --warn:#B25E00; --warn-soft:#FFF4E5; --bad:#C13515; --bad-soft:#FDECEA;
  --h1:#EDE3F7; --h2:#DCEBF7; --h3:#E0F2E3; --h4:#FBE6D6; --h5:#F8E0EA; --h6:#E4E7FA;
  --grad:linear-gradient(to right,#E61E4D 0%,#E31C5F 50%,#D70466 100%);
  --font:"DM Sans", "Helvetica Neue", system-ui, -apple-system, sans-serif;
  --pop:0 6px 20px rgba(0,0,0,.2); --surface:#FFFFFF; color-scheme:light;
  --shadow:0 6px 16px rgba(0,0,0,.12); --shadow-sm:0 1px 2px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.05);
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1760px;margin:0 auto;padding-inline:clamp(16px,4vw,80px)}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line-soft)}
.top-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding-block:14px}
.logo{display:flex;align-items:center;gap:8px;color:var(--brand);font-weight:800;font-size:21px;letter-spacing:-.03em;border:0;background:none;padding:0;justify-self:start}
.logo svg{width:32px;height:32px}
.right{display:flex;align-items:center;gap:8px;justify-self:end}
.switch-link{border:0;background:none;font-weight:600;font-size:14px;padding:10px 14px;border-radius:99px;white-space:nowrap}
.switch-link:hover{background:var(--soft)}
.menu{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:99px;padding:5px 5px 5px 12px;background:var(--bg)}
.menu:hover{box-shadow:var(--shadow-sm)}
.menu img,.menu .av{width:30px;height:30px;border-radius:50%;object-fit:cover}
.freechip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:8px 12px;border-radius:99px;background:var(--brand-soft);color:var(--brand-ink);white-space:nowrap}
.freechip.used{background:var(--soft);color:var(--muted)}

/* pill search */
.center{position:relative}
.search{position:relative;display:flex;align-items:center;height:64px;border:1px solid var(--line);border-radius:99px;background:var(--bg);box-shadow:0 3px 12px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);padding-right:8px;min-width:0;transition:background .2s,box-shadow .2s}
.search:hover{box-shadow:0 6px 18px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.06)}
.search.open,.search:has(.seg.txt:focus-within){background:var(--line-soft);box-shadow:none;border-color:transparent}
.search .seg{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 26px;border:0;background:transparent;text-align:left;min-width:0;border-radius:99px;font:inherit;color:inherit;cursor:pointer;transition:background .15s}
#dd-college{flex:0 1 220px}
#dd-course{flex:0 1 180px}
.search .seg.txt{flex:1 1 220px;cursor:text}
.search .seg+.seg::before{content:"";position:absolute;left:0;top:50%;height:32px;margin-top:-16px;border-left:1px solid var(--line);transition:opacity .15s}
.search .seg:hover::before,.search .seg:hover+.seg::before,.search .seg[aria-expanded="true"]::before,.search .seg[aria-expanded="true"]+.seg::before,.search .seg.txt:focus-within::before{opacity:0}
.search .seg:hover{background:var(--line-soft)}
.search.open .seg:hover,.search:has(.seg.txt:focus-within) .seg:hover{background:#DDDDDD}
.search .seg[aria-expanded="true"],.search .seg.txt:focus-within{background:var(--bg)!important;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.search .seg .k{font-size:12px;font-weight:700;letter-spacing:.01em}
.search .seg .v{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search .seg .v.set{color:var(--ink);font-weight:600}
.search input{border:0;background:transparent;font-size:14px;color:var(--ink);padding:0;outline:none;min-width:0;width:100%;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search .go{flex:none;height:48px;min-width:48px;margin-left:4px;padding:0 15px;border-radius:99px;border:0;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:padding .2s}
.search .go svg.i{stroke-width:3;width:16px;height:16px}
.search .go span{display:none}
.search.open .go,.search:has(.seg.txt:focus-within) .go{padding:0 20px 0 16px}
.search.open .go span,.search:has(.seg.txt:focus-within) .go span{display:inline}
.search .go:hover{filter:brightness(.95)}
.search .go:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.dd{position:absolute;top:calc(100% + 12px);left:0;z-index:40;width:min(440px,100%);background:var(--surface);border:1px solid var(--line-soft);border-radius:32px;box-shadow:var(--pop);padding:16px;display:grid;gap:2px;max-height:min(70vh,520px);overflow:auto;animation:ddin .16s ease-out}
.dd.right{left:auto;right:0}
@keyframes ddin{from{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.dd{animation:none}}
.dd h4{margin:4px 12px 8px;font-size:12px;font-weight:700;color:var(--muted)}
.ddo{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:14px;font:inherit;color:var(--ink);cursor:pointer}
.ddo:hover,.ddo:focus-visible{background:var(--soft);outline:none}
.ddo .tile{width:48px;height:48px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none;border:1px solid var(--line-soft)}
.ddo:hover .tile,.ddo:focus-visible .tile{background:var(--surface)}
.ddo .tile svg.i{width:22px;height:22px;stroke-width:1.6}
.ddo .txt{display:grid;min-width:0;flex:1}
.ddo .txt b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddo .txt small{font-size:13px;color:var(--muted)}
.ddo .ok{display:grid;color:var(--ink);visibility:hidden}
.ddo .ok svg.i{width:18px;height:18px;stroke-width:2.5}
.ddo[aria-selected="true"] .ok{visibility:visible}
.ddo[aria-selected="true"] .txt b{font-weight:700}

/* categories */
.cats-row{display:flex;align-items:center;gap:20px;padding-block:14px 0}
.cats{display:flex;gap:32px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{border:0;background:none;display:grid;justify-items:center;gap:8px;padding:4px 0 12px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.cat svg.i{width:24px;height:24px;stroke-width:1.6}
.cat:hover{color:var(--ink);border-color:var(--line)}
.cat[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.pillbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 16px;font-weight:600;font-size:13px;white-space:nowrap}
.pillbtn:hover{border-color:var(--ink)}
.pillbtn .count{background:var(--ink);color:var(--bg);border-radius:99px;font-size:11px;padding:0 6px}

/* free banner */
.banner{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-block:20px 8px;flex-wrap:wrap}
.banner .gift{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.banner .gift svg.i{width:20px;height:20px}
.banner .txt{flex:1;min-width:220px;display:grid;gap:2px}
.banner .txt b{font-size:15px}
.banner .txt span{font-size:14px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;font-weight:600;text-decoration:underline;font-size:14px}

/* grid */
.results-meta{font-size:14px;color:var(--muted);padding-block:16px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:32px 24px;padding-block:12px 64px}
.card{display:flex;flex-direction:column;gap:12px;cursor:pointer;min-width:0}
.card .ph{box-shadow:0 1px 2px rgba(0,0,0,.06);transition:box-shadow .25s}
.card:hover .ph{box-shadow:0 14px 34px rgba(0,0,0,.18)}
.ph{position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:var(--soft);max-width:100%}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:start;position:relative;overflow:hidden}
.slide img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block;transition:transform .35s}
.card:hover .slide img{transform:scale(1.03)}
.fav{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.95);color:#222;font-size:13px;font-weight:600;padding:5px 10px;border-radius:99px;box-shadow:0 1px 2px rgba(0,0,0,.18);z-index:2}
.onphoto{position:absolute;left:12px;bottom:26px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.95);color:#222;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.onphoto svg.i{width:13px;height:13px;stroke-width:3;color:#E31C5F}
.sl-pane{padding:20px 20px 30px;display:flex;flex-direction:column;gap:10px;justify-content:space-between;color:var(--ink)}
.sl-k{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.75}
.sl-big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.sl-big small{font-size:16px;font-weight:600;opacity:.6;margin-left:2px}
.sl-bars{display:grid;gap:7px}
.sl-bar{display:grid;grid-template-columns:84px minmax(0,1fr) 26px;gap:8px;align-items:center;font-size:12px;font-weight:600}
.sl-bar .t{height:6px;border-radius:99px;background:color-mix(in srgb,var(--ink) 14%,transparent);overflow:hidden}
.sl-bar .t b{display:block;height:100%;background:var(--ink);border-radius:99px}
.sl-facts{display:flex;gap:16px;font-size:12px;font-weight:600;flex-wrap:wrap}
.sl-facts span{opacity:.7;font-weight:500}
.sl-q{font-size:19px;line-height:1.35;font-weight:600;letter-spacing:-.01em}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#222;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.2);opacity:0;transition:opacity .15s,transform .15s;z-index:2}
.arrow svg.i{width:14px;height:14px;stroke-width:3}
.arrow.prev{left:10px}.arrow.next{right:10px}
.arrow:hover{transform:translateY(-50%) scale(1.06)}
.card:hover .arrow,.arrow:focus-visible{opacity:1}
@media (hover:none){.arrow{display:none}}
.dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:2;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:0 0 0 1px rgba(0,0,0,.12);transition:transform .15s}
.dots i.on{background:#fff;transform:scale(1.15)}
.heart{position:absolute;top:10px;right:10px;border:0;background:none;padding:4px;z-index:2}
.heart svg{width:26px;height:26px;fill:rgba(0,0,0,.5);stroke:#fff;stroke-width:2}
.heart[aria-pressed="true"] svg{fill:#FF385C}
.ct{display:grid;gap:2px;font-size:15px;min-width:0}
.l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.l1 b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rate{display:inline-flex;align-items:center;gap:4px;font-size:14px;white-space:nowrap}
.rate svg{width:13px;height:13px;fill:var(--star);stroke:none}
.ct .m{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rate .cnt{color:var(--muted)}
.avail{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.avail.soon{color:var(--good);font-weight:600}
.avail svg.i{width:14px;height:14px}
.price-line .u{text-decoration:underline;color:var(--muted)}
.price-line{font-size:15px;margin-top:4px}
.price-line s{color:var(--muted);font-weight:400}
.price-line b{font-weight:700}
.price-line .free{color:var(--brand-ink)}

/* card */
.shade{position:absolute;inset:auto 0 0 0;height:58%;background:linear-gradient(to top,rgba(10,10,12,.86) 0%,rgba(10,10,12,.55) 45%,rgba(10,10,12,0) 100%);pointer-events:none}
.over{position:absolute;left:0;right:0;bottom:0;padding:0 18px 26px;color:#fff;display:grid;gap:3px;pointer-events:none}
.over h3{font-size:19px;font-weight:700;letter-spacing:-.015em;display:flex;align-items:center;gap:7px;line-height:1.15}
.over h3 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.over .vt{width:18px;height:18px;border-radius:50%;background:#fff;color:#222;display:grid;place-items:center;flex:none}
.over .vt svg.i{width:11px;height:11px;stroke-width:4}
.over .r1,.over .r2{display:flex;align-items:center;gap:7px;min-width:0}
.over .r1 span,.over .r2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.over .r1 svg.i,.over .r2 svg.i{width:15px;height:15px;stroke-width:2;flex:none}
.over .r1{font-size:14.5px;font-weight:600;opacity:.96;margin-top:2px}
.over .r2{font-size:13px;opacity:.8}
.fav{background:rgba(255,255,255,.96)}
.below .row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-width:0}
.below{display:grid;gap:5px;padding:2px 2px 0;min-width:0}
.who2{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0;margin-bottom:2px}
.who2 h3{font-size:16.5px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:6px;min-width:0}
.who2 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vt2{width:16px;height:16px;border-radius:50%;background:#1D9BF0;color:#fff;display:grid;place-items:center;flex:none}
.vt2 svg.i{width:9px;height:9px;stroke-width:4}
.ln{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);min-width:0}
.ln svg.i{width:15px;height:15px;flex:none;stroke-width:1.8}
.ln span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ln.strong{color:var(--ink);font-size:14px}
.ln em.plus{flex:none;font-style:normal;font-size:11.5px;font-weight:600;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.when2 i{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none;margin-inline:4px}
.when2.soon{color:var(--good);font-weight:600}
.when2.soon i{background:var(--good);box-shadow:0 0 0 3px rgba(0,138,5,.15)}
.below .cta{margin-top:8px}
.below .rt{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;white-space:nowrap}
.below .rt svg{width:13px;height:13px;fill:var(--ink)}
.below .rt span{color:var(--muted);font-weight:400}
.below .when{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.below .when i{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.below .when.soon{color:var(--ink)} .below .when.soon i{background:#00A699;box-shadow:0 0 0 3px rgba(0,166,153,.18)}
.below .price{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.below .price b{font-weight:700}
.below .price b.free{color:var(--brand-ink)}
.below .price span{color:var(--muted)}
.below .price{display:inline-flex;align-items:baseline;gap:6px;font-size:14px;white-space:nowrap}
.below .price s{color:var(--muted);font-size:13px}
.below .price b{font-weight:700;font-size:15px}
.below .price b.free{color:var(--brand-ink)}
.below .price span{color:var(--muted);font-size:13px}
.cta{position:relative;overflow:hidden;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:700;font-size:14.5px;color:#fff;background:var(--grad);cursor:pointer;box-shadow:0 1px 2px rgba(215,4,102,.25);transition:transform .12s,box-shadow .2s,filter .2s}
.cta .l{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.cta .l svg.i{width:18px;height:18px;stroke-width:2}
.cta .cp{font-size:14px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:baseline;gap:6px}
.cta .cp small{font-size:12px;font-weight:500;opacity:.85}
.cta .cp s{opacity:.75;font-weight:500;font-size:12.5px}
.cta .r i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6);flex:none}
.cta .r.soon i{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-100%);transition:transform .6s}
.cta:hover{box-shadow:0 8px 20px rgba(227,28,95,.35);filter:saturate(1.1)}
.cta:hover::after{transform:translateX(100%)}
.cta:active{transform:scale(.98)}
.cta:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.cta.paid{background:var(--ink);box-shadow:none}
.cta.paid:hover{box-shadow:0 8px 20px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){.cta,.cta::after{transition:none}}
.below .go2{flex:none;border:0;border-radius:99px;background:var(--ink);color:var(--bg);font:inherit;font-size:13px;font-weight:600;padding:8px 14px;cursor:pointer;transition:background .15s}
.card:hover .below .go2{background:var(--brand)}
.sl-pane{padding:52px 16px 26px;overflow:hidden}
.sl-big{font-size:32px}
.sl-bars{gap:5px}
.sl-q{font-size:16px;line-height:1.4}
.empty{padding:64px 16px;text-align:center;color:var(--muted)}

/* buttons */
.btn{border:1px solid var(--ink);background:var(--bg);padding:12px 20px;border-radius:8px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.dark:hover{opacity:.88}
.btn.brand{background:var(--grad);border:0;color:#fff;font-weight:700;padding:14px 20px;font-size:16px}
.btn.brand:hover{opacity:.95}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* modal (filters) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--bg);border-radius:16px;width:min(640px,100%);max-height:90vh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;box-shadow:var(--shadow)}
.modal-h{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line-soft);text-align:center;font-weight:700}
.x{width:32px;height:32px;border-radius:50%;border:0;background:none;display:grid;place-items:center}
.x:hover{background:var(--soft)}
.modal-b{overflow:auto;padding:8px 24px}
.modal-b section{padding-block:24px;border-bottom:1px solid var(--line-soft);display:grid;gap:14px}
.modal-b section:last-child{border-bottom:0}
.modal-b h3{font-size:20px}
.modal-f{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-top:1px solid var(--line-soft)}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:10px 18px;font-size:14px;font-weight:500}
.opt:hover{border-color:var(--ink)}
.opt svg.i{width:16px;height:16px;vertical-align:-3px;margin-right:6px}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:grid;gap:6px;font-size:14px;font-weight:600}
.field select,.input,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px;font-size:15px;width:100%}
textarea{resize:vertical}

/* ---------- listing page ---------- */
.page{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(16px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.page{animation:none}.ph img{transition:none}}
.page-bar{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line-soft)}
.page-bar .in{max-width:1120px;margin:0 auto;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ghost{border:0;background:none;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:8px 10px;border-radius:8px;text-decoration:underline}
.ghost:hover{background:var(--soft)}
.listing{max-width:1120px;margin:0 auto;padding:24px 24px 120px}
.listing h1{font-size:clamp(22px,3vw,28px);font-weight:600}
.subline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:15px;margin-top:6px}
.subline b{font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:80px;margin-top:28px;align-items:start}
.tl{list-style:none;margin:0;padding:0;display:grid}
.tl-i{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr);gap:16px;padding-bottom:24px}
.tl-i:last-child{padding-bottom:0}
.tl-i:not(:last-child)::before{content:"";position:absolute;left:23.5px;top:52px;bottom:4px;border-left:2px solid var(--line-soft)}
.tl-logo{width:48px;height:48px;border-radius:12px;background:var(--soft);border:1px solid var(--line-soft);display:grid;place-items:center;position:relative;z-index:1}
.tl-logo svg.i{width:22px;height:22px;stroke-width:1.6}
.tl-b{display:grid;gap:2px;min-width:0;padding-top:2px}
.tl-b b{font-weight:600;font-size:16px}
.tl-b .deg{font-size:14.5px}
.tl-b .yrs{font-size:13.5px;color:var(--muted)}
.tl-b .mode{display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-weight:500}
.tl-b .mode svg.i{width:13px;height:13px}
.tl-b .vchk{display:inline-flex;align-items:center;gap:4px;color:var(--good);font-weight:600}
.tl-b .vchk svg.i{width:12px;height:12px;stroke-width:3}
.tl-b p{font-size:14.5px;line-height:1.55;margin-top:8px;max-width:62ch}
.socs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.soc{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--bg);font:inherit;color:var(--ink);text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.soc:hover{border-color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.soc .si{width:36px;height:36px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.soc .si svg.i{width:19px;height:19px}
.soc .sx{display:grid;min-width:0}
.soc .sx b{font-weight:600;font-size:14px}
.soc .sx small{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-socs{display:flex;gap:6px;justify-content:center;margin-top:6px}
.ms{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--c);display:grid;place-items:center;cursor:pointer}
.ms:hover{background:var(--c);color:#fff;border-color:var(--c)}
.ms svg.i{width:15px;height:15px}
.deg-ed{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.deg-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.deg-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tl.ed .tl-i:not(:last-child)::before{top:52px}
.tl.ed .tl-i{padding-bottom:16px}
.deg-ed .x svg.i{width:16px;height:16px}
.soc-ed{display:flex;align-items:flex-end;gap:12px}
.soc-ed .si{width:40px;height:40px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none;margin-bottom:2px}
.soc-ed .si svg.i{width:20px;height:20px}
.soc-ed .toggle{margin-bottom:6px}
.soc-ed .field span{font-size:13px}
.hostcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;border-radius:24px;box-shadow:0 6px 20px rgba(0,0,0,.14);padding:28px 32px;background:var(--bg)}
.hostcard .face{display:grid;justify-items:center;gap:6px;text-align:center}
.hostcard .face .pic{position:relative}
.hostcard .face img{width:112px;height:112px;border-radius:50%;object-fit:cover;display:block}
.hostcard .face .badge{position:absolute;right:-2px;bottom:4px;width:32px;height:32px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center}
.hostcard .face .badge svg.i{width:16px;height:16px;stroke-width:3}
.hostcard .face h2{font-size:26px;font-weight:700}
.hostcard .face span{font-size:13px;font-weight:600}
.hstats{display:grid;gap:0}
.hstats div{padding-block:10px;border-bottom:1px solid var(--line)}
.hstats div:last-child{border-bottom:0}
.hstats b{display:block;font-size:22px;font-weight:700;line-height:1.1}
.hstats span{font-size:12px;font-weight:600}
.sec{padding-block:32px;border-bottom:1px solid var(--line)}
.sec h2{font-size:22px;font-weight:600;margin-bottom:20px}
.hl{display:grid;gap:22px}
.hl div{display:grid;grid-template-columns:28px minmax(0,1fr);gap:20px}
.hl svg.i{width:26px;height:26px;stroke-width:1.6}
.hl b{display:block;font-weight:600}
.hl span{color:var(--muted);font-size:14px}
.about{font-size:16px;line-height:1.65;max-width:62ch;white-space:pre-line}
.bigquote{font-size:18px;line-height:1.5;max-width:60ch}
.ask{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.ask div{display:flex;gap:14px;align-items:center}
.ask svg.i{width:24px;height:24px;stroke-width:1.6}
.overall{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.scgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.sccard{border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:16px;align-content:start}
.sch{display:flex;gap:12px;align-items:center;min-width:0}
.sch .tl-logo{width:40px;height:40px;border-radius:10px}
.sch .tl-logo svg.i{width:19px;height:19px}
.sch-t{display:grid;min-width:0}
.sch-t b{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sch-t span{font-size:12.5px;color:var(--muted)}
.scavg{display:flex;align-items:center;gap:10px}
.scavg>b{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
.scavg>span{position:relative;display:inline-flex;color:var(--line)}
.scavg>span svg{width:14px;height:14px;fill:currentColor}
.scavg>span i{position:absolute;inset:0 auto 0 0;display:inline-flex;overflow:hidden;color:var(--ink);white-space:nowrap}
.scavg small{font-size:12.5px;color:var(--muted)}
.scrows{display:grid;gap:9px}
.scr{display:grid;grid-template-columns:104px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13.5px}
.scr .bar{height:6px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.scr .bar b{display:block;height:100%;border-radius:99px;background:var(--ink)}
.scr>b{text-align:right;font-weight:600}
.scgroup{display:grid;gap:36px}
.overall b.num{font-size:36px}
.sc-who{display:grid;gap:1px;margin-left:6px;padding-left:14px;border-left:1px solid var(--line)}
.overall .sc-who b{font-size:15px;font-weight:600;letter-spacing:0}
.sc-who span{font-size:13px;color:var(--muted)}
.overall b{font-size:44px;font-weight:700;letter-spacing:-.03em}
.scores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.score{padding:16px 16px 0 0;border-right:1px solid var(--line);display:grid;gap:4px;align-content:start;padding-left:16px}
.score:first-child{padding-left:0}
.score:last-child{border-right:0}
.score span{font-size:14px;font-weight:600}
.score b{font-size:18px;font-weight:600}
.score svg.i{width:28px;height:28px;stroke-width:1.5;margin-top:12px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:24px}
.fact{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:2px}
.fact b{font-size:22px;font-weight:700}
.fact span{font-size:13px;color:var(--muted)}
.reviews{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 48px}
.rv{display:grid;gap:8px;font-size:15px}
.rv .who{display:flex;gap:12px;align-items:center}
.rv .who b{display:block;font-weight:600}
.rv .who span{font-size:13px;color:var(--muted)}
.rv .stars{display:flex;gap:2px;color:var(--star)}
.rv .stars svg{width:10px;height:10px;fill:currentColor}

/* booking card */
.bk-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.bk-k{font-size:13px;color:var(--muted);font-weight:600}
.bk-p{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:2px}
.bk-p b{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.bk-p s{color:var(--muted);font-size:16px}
.bk-p span{color:var(--muted);font-size:15px}
.bk-off{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:var(--brand-ink);font-weight:700;font-size:13px;padding:6px 10px;border-radius:99px;white-space:nowrap;flex:none}
.bk-off svg.i{width:15px;height:15px}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg2 button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font:inherit;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.seg2 button svg.i{width:16px;height:16px}
.seg2 button[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.bk-sec{display:grid;gap:8px}
.bk-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.durs{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:8px}
.dur{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 4px;display:grid;gap:2px;justify-items:center;font:inherit;color:var(--ink);cursor:pointer}
.dur b{font-size:14px;font-weight:700}
.dur span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.dur span s{opacity:.7}
.dur:hover{border-color:var(--ink)}
.dur[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--soft)}
.dur[aria-pressed="true"] span{color:var(--ink)}
.bk-sum{background:var(--soft);border-radius:12px;padding:14px;display:grid;gap:8px;font-size:14px}
.bk-sum div{display:flex;justify-content:space-between;gap:12px}
.bk-sum div span:first-child{color:var(--muted)}
.bk-sum .disc,.bk-sum .disc span:first-child{color:var(--good)}
.bk-sum .total{border-top:1px solid var(--line);padding-top:10px;font-weight:700;font-size:15px}
.bk-sum .total span:first-child{color:var(--ink)}
.bk-trust{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:12.5px;color:var(--muted)}
.bk-trust li{display:flex;align-items:center;gap:8px}
.bk-trust svg.i{width:15px;height:15px}
.book .slots{grid-template-columns:repeat(3,minmax(0,1fr))}
.book{position:sticky;top:88px;border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:var(--shadow);display:grid;gap:16px;background:var(--bg)}
.book .p{font-size:22px;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.book .p s{font-size:16px;color:var(--muted);font-weight:400}
.book .p small{font-size:15px;font-weight:400}
.book .p .free{color:var(--brand-ink)}
.freenote{display:flex;gap:10px;align-items:flex-start;background:var(--brand-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px}
.freenote svg.i{color:var(--brand-ink);margin-top:1px}
.picker{border:1px solid var(--muted);border-radius:10px;overflow:hidden}
.picker .row2{display:grid;grid-template-columns:1fr 1fr}
.picker button.svcopt{border:0;background:var(--bg);text-align:left;padding:10px 12px;display:grid;gap:1px}
.picker button.svcopt+button.svcopt{border-left:1px solid var(--muted)}
.picker button.svcopt span{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.picker button.svcopt b{font-size:14px;font-weight:500}
.picker button.svcopt[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink);border-radius:10px}
.lbl{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.date{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;text-align:center;display:grid;min-width:56px}
.date small{font-size:11px;color:var(--muted)}
.date b{font-size:17px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 4px;font-weight:600;font-size:13px}
.date:hover,.slot:hover{border-color:var(--ink)}
.date[aria-pressed="true"],.slot[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.date[aria-pressed="true"] small{color:inherit}
.charge{text-align:center;font-size:14px;color:var(--muted)}
.lines{display:grid;gap:10px;font-size:15px}
.lines div{display:flex;justify-content:space-between;gap:12px}
.lines .u{text-decoration:underline}
.lines .disc{color:var(--good)}
.lines .total{border-top:1px solid var(--line);padding-top:14px;font-weight:700}
.done{display:grid;gap:12px;justify-items:center;text-align:center}
.done .ok{width:56px;height:56px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center}
.done .ok svg.i{width:28px;height:28px;stroke-width:2.5}
.mbar{display:none}

/* ---------- hosting dashboard ---------- */
.htabs{display:flex;gap:4px;justify-content:center;overflow-x:auto;scrollbar-width:none}
.htabs::-webkit-scrollbar{display:none}
.htab{border:0;background:none;padding:10px 14px;border-radius:99px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.htab:hover{background:var(--soft);color:var(--ink)}
.htab[aria-current="page"]{color:var(--ink);background:var(--soft)}
.dot-n{background:var(--brand);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-weight:700}
.host{max-width:1280px;margin:0 auto;padding:40px clamp(16px,4vw,48px) 80px}
.host h1{font-size:clamp(26px,4vw,34px);font-weight:700;letter-spacing:-.02em}
.hhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.hhead p{color:var(--muted);margin-top:6px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.rescards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.res{border:1px solid var(--line);border-radius:12px;display:grid;grid-template-rows:1fr auto;overflow:hidden}
.res .top2{padding:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}
.res .when{font-size:14px;font-weight:600;color:var(--brand-ink)}
.res .when.past{color:var(--muted)}
.res h3{font-size:20px;font-weight:600;margin-top:4px}
.res .ctx{font-size:14px;color:var(--muted);margin-top:4px}
.res .av{width:48px;height:48px;font-size:16px}
.res .foot{border-top:1px solid var(--line);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--ink)}
.tag.free{background:var(--brand-soft);color:var(--brand-ink)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.av{flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--ink)}
.hsec{margin-top:48px}
.hsec>h2{font-size:22px;font-weight:600;margin-bottom:16px}
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.st{border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:4px}
.st span{font-size:14px;color:var(--muted)}
.st b{font-size:28px;font-weight:700;letter-spacing:-.02em}
.st small{font-size:13px;color:var(--good);font-weight:600}
.st small.n{color:var(--muted);font-weight:500}
.qs{display:grid;gap:12px;max-width:820px}
.q{border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:10px}
.q .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap;align-items:center}
.q .meta b{color:var(--ink)}
.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.svc{border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:14px;align-content:start}
.svc .head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.svc h3{font-size:17px;font-weight:600}
.svc .sub{font-size:14px;color:var(--muted)}
.svc .pr{display:flex;align-items:center;gap:8px;font-size:14px}
.dured{display:grid;gap:8px}
.dured-h,.dured-r{display:grid;grid-template-columns:64px minmax(0,1fr) 48px;gap:10px;align-items:center}
.dured-h{font-size:12px;color:var(--muted);font-weight:600}
.dured-r b{font-size:14px;font-weight:600}
.dured .pin{display:flex;align-items:center;gap:6px;font-size:14px}
.dured .pin input{width:100%;padding:7px 9px}
.dured .pin input:disabled{opacity:.45}
.toggle.sm{transform:scale(.85);transform-origin:left center}
.svc .pr input{width:100px;padding:8px 10px}
.toggle{position:relative;width:48px;height:32px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.toggle span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:background .15s;pointer-events:none}
.toggle span::after{content:"";position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.toggle input:checked+span{background:var(--ink)}
.toggle input:checked+span::after{transform:translateX(16px)}
.toggle input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.info{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:20px;max-width:900px}
.info svg.i{color:var(--brand-ink);width:22px;height:22px;margin-top:2px}
.info b{display:block}
.info span{font-size:14px;color:var(--muted)}
.week{border:1px solid var(--line);border-radius:12px;max-width:900px}
.day{display:grid;grid-template-columns:130px minmax(0,1fr);gap:16px;align-items:center;padding:16px 20px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.chip.add{border-style:dashed;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{text-align:left;font-weight:600;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px}
td{padding:14px 16px;border-bottom:1px solid var(--line-soft)}
tr:last-child td{border-bottom:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;max-width:1000px}
.panel{border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:16px;align-content:start}
.panel h2{font-size:18px;font-weight:600}
.r{display:grid;grid-template-columns:130px minmax(0,1fr) 36px;gap:12px;align-items:center;font-size:14px}
input[type=range]{accent-color:var(--ink);width:100%}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;font-size:14px;z-index:90;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:1100px){
  .top-in{grid-template-columns:auto 1fr;}
  .top-in .center{grid-column:1/-1;grid-row:2;justify-self:stretch}
  .search{width:100%}
  .cols{grid-template-columns:minmax(0,1fr) 340px;gap:40px}
  .statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .book{position:static}
  .scores{grid-template-columns:repeat(2,minmax(0,1fr))}
  .score:nth-child(2){border-right:0}
  .score:nth-child(3){padding-left:0}
  .two{grid-template-columns:minmax(0,1fr)}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--bg);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));justify-content:space-between;align-items:center;gap:12px}
  .mbar .btn{padding:12px 22px}
}
@media (max-width:640px){
  .search .seg.hide-sm{display:none}
  .search{height:56px}
  .search .seg{padding:0 16px}
  #dd-college{flex:1 1 50%}
  .search .seg.txt{flex:1 1 50%}
  .search .go{height:42px;min-width:42px;padding:0 12px}
  .switch-link .long{display:none}
  .freechip .long{display:none}
  .hostcard{grid-template-columns:minmax(0,1fr);padding:24px}
  .hstats{grid-template-columns:repeat(3,minmax(0,1fr));text-align:center}
  .hstats div{border-bottom:0;border-right:1px solid var(--line)}
  .hstats div:last-child{border-right:0}
  .ask,.reviews,.facts{grid-template-columns:minmax(0,1fr)}
  .listing{padding-inline:16px}
  .page-bar .in{padding-inline:12px}
  .day{grid-template-columns:minmax(0,1fr)}
  .r{grid-template-columns:minmax(0,1fr) 36px}
  .r input{grid-column:1/-1;grid-row:2}
  .statgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .st b{font-size:22px}
  .cats{gap:24px}
}
.ydlogo{height:34px;width:auto;display:block}
.ac-tag{font-size:13px;font-weight:700;color:var(--brand-ink);border-left:1px solid var(--line);padding-left:10px;letter-spacing:0}
@media (max-width:640px){.ac-tag{display:none}.ydlogo{height:28px}}
</style>

  <div class="panel" style="max-width:1000px;margin-bottom:24px"><h2>About you</h2>
    <p class="muted" style="font-size:14px;margin-top:-8px">A few lines on what you do now, your journey and what students can ask you about.</p>
    <textarea class="input" id="my-bio" rows="4" maxlength="600" placeholder="e.g. I'm a data analyst at Fractal. I finished my BCA in 2023 while working part time. Ask me about internships and landing your first analytics role.">${esc(ME.bio||'')}</textarea>
    <span class="muted num" style="font-size:12.5px;justify-self:end" id="bio-count">${(ME.bio||'').length}/600</span></div>
  <div class="two">
    <div class="panel"><h2>Education</h2>
      <p class="muted" style="font-size:14px;margin-top:-8px">Listed newest first, like a timeline. Your most recent degree shows on your listing card.</p>
      <ol class="tl ed">${ME.degrees.map((d,i)=>`<li class="tl-i"><span class="tl-logo">${ic('college')}</span><div class="deg-ed">
        <div class="deg-top"><b class="num">${d.start} – ${d.batch}</b><div style="display:flex;gap:6px;align-items:center">${d.verified?'<span class="tag ok">Verified</span>':'<span class="tag">Verification pending</span>'}<button class="x" data-degdel="${i}" aria-label="Remove this education">${ic('trash')}</button></div></div>
        <label class="field">University<input class="input" id="deg-u-${i}" data-deg="${i}" data-f="college" value="${esc(d.college)}" placeholder="e.g. Vindhya University"></label>
        <div class="deg-grid">
          <label class="field">Degree<select class="input" id="deg-c-${i}" data-deg="${i}" data-f="course">${COURSES.map(c=>`<option value="${c}" ${c===d.course?'selected':''}>${c}</option>`).join('')}</select></label>
          <label class="field">Field of study<input class="input" id="deg-f-${i}" data-deg="${i}" data-f="field" value="${esc(d.field||'')}" placeholder="e.g. Marketing"></label>
          <label class="field" style="grid-column:1/-1">How you studied<select class="input" id="deg-m-${i}" data-deg="${i}" data-f="mode">${MODES.map(m=>`<option ${m===d.mode?'selected':''}>${m}</option>`).join('')}</select></label>
          <label class="field">Start year<input class="input num" id="deg-s-${i}" type="number" min="1980" max="2035" data-deg="${i}" data-f="start" value="${d.start}"></label>
          <label class="field">End year (or expected)<input class="input num" id="deg-b-${i}" type="number" min="1980" max="2035" data-deg="${i}" data-f="batch" value="${d.batch}"></label>
        </div>
        <label class="field">Details<textarea class="input" id="deg-d-${i}" rows="2" data-deg="${i}" data-f="details" placeholder="Projects, activities, how you studied alongside work">${esc(d.details||'')}</textarea></label>
      </div></li>`).join('')}</ol>
      <button class="btn sm" id="add-degree" style="justify-self:start">${ic('plus')}Add education</button>
    </div>
    <div class="panel"><h2>Social links</h2>
      <p class="muted" style="font-size:14px;margin-top:-8px">Switch on the ones students should see. Links help students trust that you're real.</p>
      ${NETS.map(n=>{const [lbl,icn,col]=SOC_META[n],cur=socOf(n);return `<div class="soc-ed">
        <span class="si" style="--c:${col}">${ic(icn)}</span>
        <label class="field" style="flex:1;min-width:0"><span>${lbl}</span><input class="input" id="soc-${n}" data-socnet="${n}" placeholder="${NET_PH[n]}" value="${cur?esc(cur.handle):''}"></label>
        <label class="toggle" title="Show on profile"><input type="checkbox" id="soc-on-${n}" data-socshow="${n}" ${cur&&cur.show?'checked':''} aria-label="Show ${lbl} on profile"><span></span></label>
      </div>`}).join('')}
    </div>
  </div>`}
function dReview(){
  return `<div class="hhead"><div><h1>My university review</h1><p>The first thing students read on your profile.</p></div><button class="btn dark sm" id="save-review">Save</button></div>
  <div class="two" style="grid-template-columns:minmax(0,640px)">
    <div class="panel"><h2>About your time there</h2>
      <label class="field">One-line summary<textarea id="my-quote" rows="3" maxlength="140">${esc(ME.quote)}</textarea></label>
      <div style="display:grid;gap:20px"><span class="lbl">Scorecard for each university, out of 5</span>
      ${ME.degrees.map((d,di)=>{d.scores=d.scores||{...DEFAULT_SCORES};return `<div style="display:grid;gap:10px"><div><b style="font-weight:600">${esc(d.college||'New university')}</b> <span class="muted" style="font-size:13px">· ${esc(d.course)} ${d.start} – ${d.batch}</span></div>
        ${Object.entries(d.scores).map(([k,v],i)=>`<div class="r"><span>${k}</span><input type="range" min="1" max="5" step="0.1" id="sc-${di}-${i}" data-score="${esc(k)}" data-sdeg="${di}" value="${v}"><b class="num" id="scv-${di}-${i}">${v.toFixed(1)}</b></div>`).join('')}</div>`}).join('')}</div></div>
  </div>`}

/* ---------- render ---------- */
function render(){
  $('#top').innerHTML=header();
  $('#app').innerHTML=S.view==='student'?browse():dash();
  renderOverlay()}
function renderResults(){const r=$('#results');if(r)r.innerHTML=results();const fb=$('#open-filters');if(fb)fb.innerHTML=`${ic('sliders')}Filters${filterCount()?`<span class="count num">${filterCount()}</span>`:''}`}
function renderOverlay(){
  const a=S.profile&&ALUMNI.find(x=>x.id===S.profile);
  let h='';
  if(S.view==='student'&&a)h=listing(a);
  if(S.view==='student'&&S.filtersOpen)h+=filtersModal();
  $('#overlay').innerHTML=h;
  document.body.style.overflow=h?'hidden':''}
function renderBook(){const a=ALUMNI.find(x=>x.id===S.profile),bc=$('#bookcard');if(!a||!bc){renderOverlay();return}bc.innerHTML=bookCard(a);const m=$('.mbar');if(m)m.outerHTML=mbarHTML(a)}
function open(id){Object.assign(S,{profile:id,svc:0,dur:1,date:0,slot:null,done:null});renderOverlay()}

document.addEventListener('submit',e=>{if(e.target.id==='searchform'){e.preventDefault();renderResults()}});
document.addEventListener('click',e=>{
  if(S.dd&&!e.target.closest('.dd,[data-dd]')){setDD(null)}
  const pk=e.target.closest('[data-pick]');
  if(pk){S[S.dd]=pk.dataset.pick;const k=S.dd;setDD(null);renderResults();$('#dd-'+k)?.focus();return}
  const dd=e.target.closest('[data-dd]');
  if(dd){setDD(S.dd===dd.dataset.dd?null:dd.dataset.dd);return}
  const t=e.target.closest('button,[data-open],[data-scrim]');if(!t)return;
  const d=t.dataset;
  if(d.view){S.view=d.view;S.profile=null;S.filtersOpen=false;try{localStorage.setItem('ac2-view',S.view)}catch(_){};render();scrollTo(0,0);return}
  if(d.heart){const id=+d.heart;S.saved.has(id)?S.saved.delete(id):S.saved.add(id);t.setAttribute('aria-pressed',S.saved.has(id));if(!t.classList.contains('heart'))t.textContent=S.saved.has(id)?'Saved':'Save';
    document.querySelectorAll(`.heart[data-heart="${id}"]`).forEach(h=>h.setAttribute('aria-pressed',S.saved.has(id)));toast(S.saved.has(id)?'Saved to your shortlist':'Removed from shortlist');return}
  if(d.slide){const tr=t.parentElement.querySelector('.track');tr.scrollBy({left:+d.slide*tr.clientWidth,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});return}
  if(d.open){open(+d.open);return}
  if(d.home!==undefined){Object.assign(S,{cat:'all',q:'',college:'all',course:'all',dd:null});render();return}
  if(d.cat){S.cat=d.cat;document.querySelectorAll('.cat').forEach(c=>c.setAttribute('aria-pressed',c.dataset.cat===S.cat));renderResults();return}
  if(t.id==='open-filters'){S.filtersOpen=true;renderOverlay();return}
  if(d.closefilters!==undefined||(d.scrim==='filters'&&e.target===t)){S.filtersOpen=false;renderOverlay();renderResults();return}
  if(d.mode){S.mode=d.mode;renderOverlay();return}
  if(d.topic){S.topic=S.topic===d.topic?null:d.topic;renderOverlay();return}
  if(d.price){S.price=d.price;renderOverlay();return}
  if(d.sort){S.sort=d.sort;renderOverlay();return}
  if(d.clearfilters!==undefined){Object.assign(S,{price:'any',topic:null,mode:'any',sort:'rec'});renderOverlay();return}
  if(d.clear!==undefined){Object.assign(S,{q:'',college:'all',course:'all',cat:'all',price:'any',topic:null,mode:'any',sort:'rec'});render();return}
  if(d.resetfree!==undefined){S.freeLeft=1;render();toast('Demo reset: 25% first-call discount restored');return}
  if(d.closepage!==undefined){S.profile=null;renderOverlay();return}
  if(d.sharebtn!==undefined){toast('Profile link copied');return}
  if(d.scrollbook!==undefined){$('#bookcard')?.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(d.svc){S.svc=+d.svc;S.slot=null;renderBook();return}
  if(d.dur){S.dur=+d.dur;renderBook();return}
  if(d.date){S.date=+d.date;S.slot=null;renderBook();return}
  if(d.slot){S.slot=d.slot;renderBook();return}
  if(d.again!==undefined){S.done=null;S.slot=null;renderBook();return}
  if(t.id==='confirm'){
    const a=ALUMNI.find(x=>x.id===S.profile),q=quote(a);
    if(!q.call&&($('#dm')?.value||'').trim().length<10){toast('Write a question of at least 10 characters');return}
    if(q.call&&!S.slot)return;
    const free=q.free;
    S.done={t:q.s.t,free,paid:q.pay,full:q.full,dur:q.call?q.o.dur:0,when:nextDays()[S.date].long,slot:S.slot};
    if(free)S.freeLeft=0;S.connects++;
    $('#top').innerHTML=header();renderResults();const b=$('.banner');if(b)b.outerHTML=banner();
    renderBook();return}
  /* dashboard */
  if(d.tab){S.tab=d.tab;render();scrollTo(0,0);return}
  if(d.rtab){S.rTab=d.rtab;render();return}
  if(d.answer){const v=($('#ans-'+d.answer)?.value||'').trim();if(!v){toast('Write an answer before sending');return}
    const q=QUESTIONS.find(x=>x.id===d.answer);S.answered.add(d.answer);render();toast(`Answer sent. ${rupee(q.amt)} added to earnings${q.free?' (YourDegree covered the 25% first-connect discount)':''}`);return}
  if(t.id==='copy-link'){const txt='alumniconnect.in/ananya-iyer';(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Profile link copied'),()=>toast('Your link: '+txt));return}
  if(d.join!==undefined){toast('In the live product this opens the video call');return}
  if(d.msg!==undefined){toast('In the live product this opens a chat with the student');return}
  if(t.id==='add-svc'){SERVICES.push({id:'s'+(SERVICES.length+1),title:'New service',kind:'Video call',dur:15,price:99,on:false,booked:0,icon:'video'});render();toast('Draft added. Set a price, then switch it on');return}
  if(d.addslot){const sl=WEEK[+d.addslot][1];const n=['7:00 PM','8:00 PM','9:00 PM','10:00 AM','6:00 PM'].find(o=>!sl.includes(o));if(n){sl.push(n);render()}return}
  if(t.id==='save-av'){toast('Calendar saved');return}
  if(t.id==='save-review'){const q=$('#my-quote').value.trim();if(q)ME.quote=q;syncLatest(ME);toast('Review saved. Students see it on your profile');return}
  if(d.soc){toast(`In the live product this opens ${d.soc}`);return}
  if(t.id==='add-degree'){const y=new Date().getFullYear();ME.degrees.unshift({course:'MBA',start:y-2,batch:y,college:'',field:'',details:'',mode:'Online',verified:false,scores:{...DEFAULT_SCORES}});render();$('#deg-u-0')?.focus();return}
  if(d.degdel){if(ME.degrees.length===1){toast('Keep at least one education entry');return}ME.degrees.splice(+d.degdel,1);syncLatest(ME);render();toast('Education removed');return}
  if(t.id==='save-profile'){syncLatest(ME);render();toast('Profile saved. Students see your education and links now');return}
  if(t.id==='withdraw'){toast('Withdrawal of ₹4,980 requested');return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.dd){const k=S.dd;setDD(null);$('#dd-'+k)?.focus();return}
  if((e.key==='ArrowDown'||e.key==='ArrowUp')&&e.target.closest('.dd')){e.preventDefault();const o=[...document.querySelectorAll('.ddo')],i=o.indexOf(e.target);o[(i+(e.key==='ArrowDown'?1:-1)+o.length)%o.length].focus();return}
  if(e.key==='Escape'){if(S.filtersOpen){S.filtersOpen=false;renderOverlay()}else if(S.profile){S.profile=null;renderOverlay()}}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open]')){e.preventDefault();open(+e.target.dataset.open)}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='my-bio'){ME.bio=t.value;const c=$('#bio-count');if(c)c.textContent=t.value.length+'/600'}
  if(t.dataset.deg!==undefined){const dg=ME.degrees[+t.dataset.deg],f=t.dataset.f;dg[f]=(f==='batch'||f==='start')?(+t.value||dg[f]):t.value}
  if(t.dataset.socnet){const n=t.dataset.socnet;let cur=ME.socials.find(x=>x.net===n);const v=t.value.trim();if(!cur&&v){cur={net:n,handle:v,show:true};ME.socials.push(cur);const tg=$('#soc-on-'+n);if(tg)tg.checked=true}else if(cur){cur.handle=v;if(!v)ME.socials=ME.socials.filter(x=>x!==cur)}}
  if(t.id==='q'){S.q=t.value;renderResults()}
  if(t.dataset.score){ME.degrees[+t.dataset.sdeg].scores[t.dataset.score]=+t.value;$('#scv-'+t.id.slice(3)).textContent=(+t.value).toFixed(1)}
  if(t.dataset.durprice){const [sid,i]=t.dataset.durprice.split(':');const sv=SERVICES.find(x=>x.id===sid);sv.durs[+i].price=Math.max(0,+t.value||0);if(sid==='s1')syncCall(ME)}
  if(t.dataset.setprice){const s=SERVICES.find(x=>x.id===t.dataset.setprice);s.price=Math.max(0,+t.value||0);if(s.id==='s1')ME.services[0].price=s.price;if(s.id==='s2')ME.services[1].price=s.price}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.deg!==undefined){const dg=ME.degrees[+t.dataset.deg],f=t.dataset.f;if(f==='course')dg.course=t.value;if(f==='mode'){dg.mode=t.value;render();return}if(f==='batch'||f==='start'){const ae=t.id;syncLatest(ME);render()}else syncLatest(ME)}
  if(t.dataset.socshow){const n=t.dataset.socshow,cur=ME.socials.find(x=>x.net===n);if(cur)cur.show=t.checked;else{t.checked=false;toast('Add a link first, then switch it on')}}
  if(t.dataset.duron){const [sid,i]=t.dataset.duron.split(':');const sv=SERVICES.find(x=>x.id===sid);if(!t.checked&&sv.durs.filter(x=>x.on).length===1){t.checked=true;toast('Keep at least one call length on');return}sv.durs[+i].on=t.checked;if(sid==='s1')syncCall(ME);render();return}
  if(t.dataset.toggle){const s=SERVICES.find(x=>x.id===t.dataset.toggle);s.on=t.checked;render();toast(s.on?'Service is live on your profile':'Service hidden from students')}});
render();
</script>

</body>
</html>
